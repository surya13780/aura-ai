<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • AI Companion</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0f0f1a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .header { background: #16162a; padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #7c4dff, #ff4081); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .header-text h2 { font-size: 1rem; font-weight: 700; }
    .header-text p { font-size: 0.75rem; color: #8f8fa8; }
    .cam-btn { background: rgba(255, 64, 129, 0.15); color: #ff4081; border: 1px solid rgba(255, 64, 129, 0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .routine-banner { background: #1a1a2e; padding: 10px 16px; font-size: 0.8rem; color: #ffca28; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.4; }
    .message.ai { background: #22223b; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.user { background: #7c4dff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .input-container { background: #16162a; padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
    .input-container input { flex: 1; background: #0f0f1a; border: 1px solid rgba(255,255,255,0.1); padding: 14px 18px; border-radius: 25px; color: #fff; font-size: 0.95rem; outline: none; }
    .send-btn { background: #7c4dff; color: #fff; border: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="user-info">
      <div class="avatar">✨</div>
      <div class="header-text">
        <h2>Aura (Your Friend)</h2>
        <p>Always listening • Online</p>
      </div>
    </div>
    <button class="cam-btn" onclick="alert('Camera Scanner will activate here in Phase 3!')">
      <i class="fa-solid fa-camera"></i>
    </button>
  </div>

  <div class="routine-banner">
    <span><i class="fa-regular fa-clock"></i> Next routine step coming up soon</span>
    <strong style="color:#7c4dff;">View</strong>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="message ai">
      Hey friend! 👋 Good to see you on your home screen. Tell me what you are doing today and how you are feeling!
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Talk to Aura..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      const chatBox = document.getElementById('chatBox');

      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        const aiDiv = document.createElement('div');
        aiDiv.className = 'message ai';
        aiDiv.innerText = "I hear you! I am almost ready to start tracking your daily routine and memories!";
        chatBox.appendChild(aiDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 1000);
    }
  </script>
</body>
</html>
